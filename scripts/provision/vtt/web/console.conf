# ABOUTME: nginx (unprivileged) for the workshop VTT console. Serves the two-pane lab page as the front
# ABOUTME: door and reverse-proxies /terminal/ to ttyd in the same pod, with the websocket upgrade ttyd needs.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;   # lab.html, ConfigMap-mounted

  # The two-pane student lab page is the front door: instructions left, ttyd embedded right.
  location = /         { try_files /lab.html =404; }
  location = /lab      { try_files /lab.html =404; }

  # The interactive architecture blueprint (progressive reveal, phases 0-8). Served standalone for the
  # presenter and embedded as a tab in the lab page.
  location = /diagram  { try_files /diagram.html =404; }

  # The component endpoint directory (phase-revealed). Standalone and embedded as a lab tab.
  location = /links    { try_files /links.html =404; }

  # Web terminal (ttyd serves under base-path /terminal); needs websocket upgrade. ttyd runs in the
  # same pod, so this reaches it over loopback.
  location /terminal/ {
    proxy_pass http://127.0.0.1:7681;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # VS Code (code-server) in the same pod on loopback:8443, served under /ide/. The trailing slash strips
  # the /ide/ prefix; code-server emits relative asset URLs so it resolves under the subpath. Needs the
  # same websocket upgrade as ttyd, and code-server requires `Accept-Encoding gzip` when proxied.
  location /ide/ {
    proxy_pass http://127.0.0.1:8443/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Accept-Encoding gzip;
    proxy_read_timeout 3600s;
  }

  # JupyterLab in the same pod on loopback:8888, served under /jupyter/. NO trailing slash: the server runs
  # with base_url=/jupyter and expects the prefix. Kernel comms are websockets, so the upgrade headers and
  # a long read timeout are required.
  location /jupyter/ {
    proxy_pass http://127.0.0.1:8888;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }

  # Workshop Tutor terminal: a second ttyd (Claude Code on Bedrock, read-only) on loopback:7682, served
  # under /tutor. Same websocket upgrade as /terminal/.
  location /tutor/ {
    proxy_pass http://127.0.0.1:7682;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # Current build phase, written by the status sidecar. Missing until the first write (returns 404, which
  # the Blueprint poll ignores). Never cached, so the diagram sees fresh progress.
  location = /api/status {
    alias /run/status/status.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
  }

  # Proactive tutor nudge, written by the tutor watcher to the shared /run/tutor volume. Missing until the
  # first nudge (returns 404, which the lab-page poll ignores). Never cached, so the banner sees it fresh.
  location = /api/tutor-nudge {
    alias /run/tutor/nudge.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
  }

  location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }
}
