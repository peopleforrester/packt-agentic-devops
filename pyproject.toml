# ABOUTME: Root pytest configuration. Scopes a bare `pytest` to the platform suite, so the most
# ABOUTME: obvious command a reader types runs the tests rather than aborting during collection.
#
# testpaths names the two places tests live: tests/ for the phase gates and the manifest checks,
# and the two script-local suites that cover the probe helpers.
#
# The cluster-bound tests skip themselves when KUBECONFIG_FILE is unset, so a bare `pytest` is safe
# with no cluster and reports those as skipped rather than failing.
[tool.pytest.ini_options]
testpaths = [
    "tests",
    "scripts/test_probes.py",
    "scripts/test_check_components.py",
]
# An explicitly named path still recurses, so keep collection out of the vendored charts and
# anything a build drops beside them.
norecursedirs = [
    "charts-vendor",
    ".git",
    "*.egg-info",
]
markers = [
    "integration: needs a fully built cluster and in-cluster traffic",
]
